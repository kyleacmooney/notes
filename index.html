<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a1e">
    <title>Lecture Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Source Sans 3", -apple-system, sans-serif;
            min-height: 100vh;
            background: linear-gradient(165deg, #1a1a1e 0%, #222226 40%, #1e1e22 100%);
            color: #c8c8d0;
            padding: 48px;
            line-height: 1.7;
        }

        .header {
            margin-bottom: 48px;
            text-align: center;
        }

        h1 {
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 36px;
            font-weight: 500;
            color: #f0ebe3;
            letter-spacing: 0.01em;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #707078;
            font-style: italic;
        }

        .header::after {
            content: "";
            display: block;
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, #8b454f 50%, transparent 100%);
            margin: 24px auto 0;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .subject-card {
            display: block;
            padding: 28px 24px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(139, 69, 79, 0.2);
            border-radius: 16px;
            text-decoration: none;
            transition: all 0.25s;
            text-align: center;
        }

        .subject-card:hover {
            background: rgba(139, 69, 79, 0.1);
            border-color: rgba(139, 69, 79, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .subject-card h2 {
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 22px;
            font-weight: 500;
            color: #f0ebe3;
            margin-bottom: 8px;
        }

        .lecture-count {
            font-size: 13px;
            color: #707078;
        }

        @media (max-width: 600px) {
            body {
                padding: 24px;
            }

            h1 {
                font-size: 28px;
            }

            .subjects {
                grid-template-columns: 1fr;
            }

            .subject-card {
                padding: 24px 20px;
            }

            .subject-card h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Lecture Notes</h1>
        <p class="subtitle">Mathematical notes with KaTeX rendering</p>
    </div>
    <div class="subjects">
        
        <a href="probability/index.html" class="subject-card">
            <h2>Probability</h2>
            <span class="lecture-count">8 lectures</span>
        </a>

        <a href="quick-notes/index.html" class="subject-card">
            <h2>Quick Notes</h2>
            <span class="lecture-count">24 lectures</span>
        </a>

        <a href="real-analysis/index.html" class="subject-card">
            <h2>Real Analysis</h2>
            <span class="lecture-count">2 lectures</span>
        </a>
    </div>
</body>
</html>
